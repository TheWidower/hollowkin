// ---------- progression rules (stage 3 uses these directly) ----------
const MAX_LEVEL = 30;
const MAX_MOVES = 4;
const TRAINER_XP_BONUS = 1.5;
// Stats at a level (HP gains on level-up are added to current HP too).
function statsAt(speciesId, level) {
  const b = SPECIES[speciesId].base;
  const f = (v) => Math.floor(v * 2 * level / 100);
  return { hp: f(b.hp) + level + 10, atk: f(b.atk) + 5, def: f(b.def) + 5, spd: f(b.spd) + 5 };
}
// Total XP needed to BE at a level (Lv 1 = 0).
function xpForLevel(level) { return level <= 1 ? 0 : level * level * level; }
// XP awarded for knocking out a creature (split evenly among party members that battled).
function xpReward(foeSpeciesId, foeLevel, isTrainer) {
  const raw = SPECIES[foeSpeciesId].xp * foeLevel / 5;
  return Math.max(1, Math.floor(raw * (isTrainer ? TRAINER_XP_BONUS : 1)));
}
// The (up to) 4 most recently learned moves at or below a level.
function movesAtLevel(speciesId, level) {
  const known = SPECIES[speciesId].learnset.filter(([, lv]) => lv <= level).map(([id]) => id);
  return known.slice(-MAX_MOVES);
}
// Moves newly offered when reaching exactly this level.
function movesLearnedAt(speciesId, level) {
  return SPECIES[speciesId].learnset.filter(([, lv]) => lv === level).map(([id]) => id);
}

// ===================== UTIL =====================
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function checkRows(name, rows, w = 16, h = 16) {
  if (rows.length !== h) throw new Error(`${name}: expected ${h} rows, got ${rows.length}`);
  rows.forEach((r, i) => { if (r.length !== w) throw new Error(`${name}: row ${i} has ${r.length} chars (want ${w})`); });
  return rows;
}
function mirror(name, half) {
  half.forEach((r, i) => { if (r.length !== 8) throw new Error(`${name}: half-row ${i} has ${r.length} chars (want 8)`); });
  return checkRows(name, half.map(r => r + r.split('').reverse().join('')));
}
function drawPattern(g, rows, pal, ox = 0, oy = 0, flip = false) {
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      const col = pal[ch];
      if (!col) throw new Error(`No palette color for '${ch}'`);
      g.fillStyle = col;
      g.fillRect(ox + (flip ? row.length - 1 - x : x), oy + y, 1, 1);
    }
  }
}
function patternCanvas(rows, pal, flip = false) { const c = mkCanvas(rows[0].length, rows.length); drawPattern(c.getContext('2d'), rows, pal, 0, 0, flip); return c; }

function buildHumanFrames(colors) {

// draws one tile into a 16x16 context. info = { ch, base, v, frame, n: {u,d,l,r} neighbour chars }
function drawTileArt(g, info) {
  const { ch, v, frame, n } = info;
  if (OVERLAY_TILES.has(ch)) drawTileArt(g, { ch: info.base, base: info.base, v, frame: 0, n: info.base === 'r' ? { u: 'r', d: 'r', l: 'r', r: 'r' } : {} });

    case ',': {
      rect(g, P.vgrass, 0, 0, 16, 16); speckle(g, 21 + v, 10, [P.vgrass2, P.vgrassDry]);
      for (let i = 0; i < 2; i++) {

      for (let row = 0; row < 4; row++) {

      rect(g, P.water, 0, 0, 16, 16);

        const x = Math.floor(hash2(v, i, 7) * 12) + ((frame + i) % 2 ? 1 : -1), y = 2 + i * 4;
        rect(g, P.water2, x, y, 4, 1);
      }

      if (n.u && n.u !== '~' && n.u !== '=') { rect(g, P.ground3, 0, 0, 16, 2); rect(g, P.waterHi, 0, 2, 16, 1); }
      if (n.l && n.l !== '~' && n.l !== '=') rect(g, P.ground3, 0, 0, 1, 16);
      if (n.r && n.r !== '~' && n.r !== '=') rect(g, P.ground3, 15, 0, 1, 16);
      break;

      for (let y = 3; y < 16; y += 4) rect(g, '#4a3224', 1, y, 14, 1);

// Lights for the map's current rows (recomputed when a lantern is relit).
function computeLights(m) {

    const ch = m.rows[y][x], L = TILE_INFO[ch].light;
    if (L) m.lights.push({ x: x * 16 + (L.ox ?? 8), y: y * 16 + (L.oy ?? 8), r: L.r, c: L.c, seed: hash2(x, y, 3) * 10 });
    if (ch === 'T' && Math.floor(hash2(x, y, 99) * 12) === 7) m.lights.push({ x: x * 16 + 7, y: y * 16 + 6, r: 4, c: '255,224,102', seed: 0 });
  }
}
// Story changes to the map, rebuilt from flags: relit trail lanterns (l -> L) and the withered Thornwall (X -> ground).
const TRAIL_LANTERNS = [[13, 39], [17, 41], [14, 32], [17, 28]];   // lantern1..4
const THORNWALL = [30, 28];
function applyWorldState(m) {
  if (!m || m.id !== 'overworld' || !Game.state) return;
  const f = Game.state.flags, rows = m.baseRows.map(r => r.split(''));
  TRAIL_LANTERNS.forEach(([x, y], i) => { if (f['lantern' + (i + 1)]) rows[y][x] = 'L'; });
  if (f.bossDefeated) rows[THORNWALL[1]][THORNWALL[0]] = '.';
  const next = rows.map(r => r.join(''));

}
function buildMaps() {

  for (const [id, rows] of Object.entries(INTERIOR_ROWS)) MAPS[id].rows = rows;
  for (const [id, m] of Object.entries(MAPS)) {
    m.id = id;
    m.w = m.rows[0].length; m.h = m.rows.length;
    m.rows.forEach((r, y) => {
      if (r.length !== m.w) throw new Error(`Map ${id}: row ${y} has width ${r.length}, expected ${m.w}`);
      for (const ch of r) if (!TILE_INFO[ch]) throw new Error(`Map ${id}: unknown tile '${ch}' in row ${y}`);
    });
    m.doors = m.doors || {}; m.inspect = m.inspect || {}; m.npcs = m.npcs || []; m.zones = m.zones || [];
    // base ground under overlay tiles (trees, lanterns...) = most common nearby ground
    m.base = [];
    for (let y = 0; y < m.h; y++) {
      m.base.push([]);
      for (let x = 0; x < m.w; x++) {
        const counts = {}, near = {};
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const c = (m.rows[y + dy] || '')[x + dx];
          if (c === '.' || c === ',' || c === '_' || c === 'r') {
            counts[c] = (counts[c] || 0) + 1;
            if (Math.abs(dx) + Math.abs(dy) === 1) near[c] = (near[c] || 0) + 1;
          }
        }
        const nearKeys = Object.keys(near);
        if (nearKeys.length === 1) { m.base[y].push(nearKeys[0]); continue; }   // e.g. a table in the middle of a rug
        let best = m.outdoor ? '.' : '_', bn = 0;
        for (const [c, nn] of Object.entries(counts)) if (nn > bn) { best = c; bn = nn; }
        m.base[y].push(best);
      }
    }
    m.baseRows = m.rows.slice();
    computeLights(m);

}

function pickEncounter(tableId, rng) {
  const table = ENCOUNTER_TABLES[tableId];
  const total = table.reduce((s, e) => s + e.weight, 0);
  let r = rng() * total;
  for (const e of table) {
    r -= e.weight;
    if (r < 0) return { species: e.species, level: e.levels[0] + Math.floor(rng() * (e.levels[1] - e.levels[0] + 1)) };
  }

// ---------- SAFE STORAGE ----------
// EVERY localStorage access goes through here. Private browsing, blocked cookies, sandboxed iframes and full
// quotas can make even *touching* window.localStorage throw, so each call is wrapped: reads fall back to null,
// writes report false, and the game keeps running either way.
const SafeStorage = {
  get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; } },
  remove(key) { try { window.localStorage.removeItem(key); return true; } catch (e) { return false; } },
  getJSON(key) { const raw = this.get(key); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } },
  setJSON(key, obj) { let raw; try { raw = JSON.stringify(obj); } catch (e) { return false; } return this.set(key, raw); },
};

// Brightness scales how dark the night overlay is (map.ambient) and slightly widens the player's lantern.
// 'Dark' is the original stage-2 look; the default 'Normal' is a bit brighter.
const BRIGHTNESS = [
  { name: 'Dark',   ambient: 1.00, light: 1.00 },
  { name: 'Normal', ambient: 0.74, light: 1.12 },
  { name: 'Bright', ambient: 0.48, light: 1.28 },

const SETTINGS_KEY = 'gloamwood.settings.v1';   // key kept from before the rename to Hollowkin, so settings/saves carry over
const Settings = {
  brightness: 1,
  volume: 6, muted: false, ambient: true,   // sound (stage 5): volume 0-10, mute, quiet ambience loop per area
  load() {
    const s = SafeStorage.getJSON(SETTINGS_KEY);
    if (!s || typeof s !== 'object') return;
    if (Number.isInteger(s.brightness) && BRIGHTNESS[s.brightness]) this.brightness = s.brightness;
    if (Number.isInteger(s.volume) && s.volume >= 0 && s.volume <= 10) this.volume = s.volume;
    if (typeof s.muted === 'boolean') this.muted = s.muted;
    if (typeof s.ambient === 'boolean') this.ambient = s.ambient;
  },
  save() { return SafeStorage.setJSON(SETTINGS_KEY, { brightness: this.brightness, volume: this.volume, muted: this.muted, ambient: this.ambient }); },
  setVolume(v) { this.volume = clamp(Math.round(v), 0, 10); if (this.volume > 0) this.muted = false; this.save(); Sound.applyVolume(); return this.volume; },
  toggleMute() { this.muted = !this.muted; this.save(); Sound.applyVolume(); return this.muted; },

  cycleBrightness(d = 1) { return this.setBrightness(this.brightness + d); },

const SAVE_KEY = 'gloamwood.save.v1';   // key kept from before the rename to Hollowkin, so old saves carry over

const SaveSystem = {
  save() {
    if (!Game.state) return false;
    Game.syncPlayerToState();
    const prev = Game.state.savedAt;
    Game.state.savedAt = Date.now();
    const ok = SafeStorage.setJSON(SAVE_KEY, Game.state);
    if (!ok) Game.state.savedAt = prev;
    return ok;
  },
  read() {   // the stored save if it looks usable, else null
    const d = SafeStorage.getJSON(SAVE_KEY);

  },

  // Short summary for the title screen / save prompt.

    const party = (d.party || []).filter(c => c && SPECIES[c.species]);

    for (const k of ['party', 'storage']) st[k] = Array.isArray(data[k]) ? data[k].filter(c => c && SPECIES[c.species]) : [];

const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', ' ': 'a', z: 'a', Z: 'a',
  Enter: 'start', Escape: 'b', Backspace: 'b', x: 'b', X: 'b', b: 'b', B: 'b' };
const INPUT_KEYS = ['up', 'down', 'left', 'right', 'a', 'b', 'start'];

// (Public wrapper for touch controls: window.gameInput, documented at the top of the ENGINE part.)
const Input = {
  held: [],   // directions currently held, most recent last
  press(k) {
    if (!INPUT_KEYS.includes(k)) return false;
    if (DIRS[k]) { this.held = this.held.filter(d => d !== k); this.held.push(k); }
    Game.press(k);
    return true;
  },
  release(k) { if (DIRS[k]) this.held = this.held.filter(d => d !== k); },
  releaseAll() { this.held = []; },
  init() {
    window.addEventListener('keydown', (e) => {
      const k = KEYMAP[e.key]; if (!k) return;

      if (e.repeat) return;

    });
    window.addEventListener('keyup', (e) => { const k = KEYMAP[e.key]; if (k) this.release(k); });
    window.addEventListener('blur', () => this.releaseAll());
  },
  heldDir() { return this.held.length ? this.held[this.held.length - 1] : null; },

      else if (k === 'b' || ((k === 'a' || k === 'start') && !this.confirm.yes)) this.confirm = null;

class EncounterFlashScene {

  // style: 'wild' (flicker, then shutters close), 'trainer' (flicker, then a spiral of squares), 'boss' (slow blinds).
  constructor(then, style = 'wild') {

    if (this.t < flashEnd) { g.fillStyle = phase ? 'rgba(240,236,255,0.75)' : 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, 640, 576); return; }

      const n = Math.ceil(order.length * k);

  const out = []; let x0 = 0, y0 = 0, x1 = w - 1, y1 = h - 1;
  while (x0 <= x1 && y0 <= y1) {
    for (let x = x0; x <= x1; x++) out.push([x, y0]);
    for (let y = y0 + 1; y <= y1; y++) out.push([x1, y]);
    if (y1 > y0) for (let x = x1 - 1; x >= x0; x--) out.push([x, y1]);
    if (x1 > x0) for (let y = y1 - 1; y > y0; y--) out.push([x0, y]);
    x0++; y0++; x1--; y1--;

  return out;
}

class OverworldScene {

    if (ch === 'e' && map.exit) { Sound.play('door'); Game.warp(map.exit.to, map.exit.tx, map.exit.ty, map.exit.dir); return; }
    Sound.play(TILE_INFO[ch].encounter ? 'grass' : 'step');
    this.checkZone();
    if (Trainers.check(Game)) return;   // route trainers challenge on line of sight (15_trainers.js) before any wild encounter
    if (TILE_INFO[ch].encounter) {
      const z = zoneAt(map, p.x, p.y);
      if (z && z.table && Game.encountersEnabled && Game.rng() < ENCOUNTER_RATE) {

        const reminder = Quests.reminder(Game);
        if (reminder && Game.state.settings.markers && !Game.toasts.includes(reminder)) Game.toasts.push(reminder);

    let npc = Game.npcAt(fx, fy);

    if (npc) return Game.talkTo(npc);

    const ins = map.inspect[`${fx},${fy}`];

      L: ['The lantern burns with a steady orange glow. Moths circle it lazily.'],
      l: ['A snuffed lantern. The wick is cold and smells of rude wind.', 'If you had a taper, you could relight it.'],
      '~': ['The water is black as ink. Something blinks back at you.'],
      P: ['A grinning jack-o\'-lantern. It seems very pleased with itself.'],
      B: ['Prickly brambles. They snag your sleeve like they want you to stay.'],

// ===================== ENGINE =====================
/* ---------------------------------------------------------------------
   INPUT HOOK FOR TOUCH CONTROLS (and anything else that wants to drive the game)

     window.gameInput.press(key)    // button went down   (same as a keydown)
     window.gameInput.release(key)  // button came up     (same as a keyup)
     window.gameInput.tap(key)      // press + release, for one-shot buttons
     window.gameInput.releaseAll()  // e.g. on touchcancel / when the page loses focus
     window.gameInput.keys          // ['up','down','left','right','a','b','start']

   key meanings (identical to the keyboard):
     'up' 'down' 'left' 'right' = arrow keys. Holding a direction (press without release) keeps walking,
                                  exactly like holding an arrow key; release it on touchend.
     'a'     = Space / Z   (talk, inspect, advance text, confirm menu choices)
     'b'     = X / Esc / Backspace / B  (back / cancel in menus; on the map it asks Nib for a hint)
     'start' = Enter       (start on the title screen; opens the pause menu on the map; confirms in battle)
   Brightness moved to the title screen (Left/Right) and Pause -> OPTIONS in stage 4.
   press() returns false for unknown keys. The hook exists as soon as this script has run (before boot()),
   so a later part such as tools/parts/09_touch.js can call it directly from its button handlers.
   --------------------------------------------------------------------- */
window.gameInput = Object.freeze({
  keys: INPUT_KEYS.slice(),
  press(key) { return Input.press(key); },
  release(key) { Input.release(key); },
  tap(key) { const ok = Input.press(key); Input.release(key); return ok; },
  releaseAll() { Input.releaseAll(); },
});

// ===================== NPC RUNTIME =====================
// def.when(Game) (optional) decides whether an NPC is on the map right now (e.g. Lady Ashgrave moves after the boss).
function npcVisible(def) { return !def.when || !!def.when(Game); }
function spawnNPC(def) {
  return spawnNPCs({ npcs: [def] })[0];
}
function spawnNPCs(map) {
  return map.npcs.filter(npcVisible).map(def => ({
    def, x: def.x, y: def.y, tx: def.x, ty: def.y, dir: def.dir || 'down', moving: false, moveT: 0, stepParity: 0,
    frames: def.cat ? buildCatFrames(def.ghost.body) : def.creature ? creatureFrames(def.creature) : def.ghost ? buildGhostFrames(def.ghost) : buildHumanFrames(LOOKS[def.look]),
    float: !!(def.ghost || (def.creature && !def.sleep)), wanderT: 1 + hash2(def.x, def.y, 8) * 3,
  }));
}
function updateNPCs(dt) {
  for (const n of Game.npcs) {
    if (n.moving) {
      n.moveT += dt / (WALK_TIME * 1.6);
      if (n.moveT >= 1) { n.moving = false; n.x = n.tx; n.y = n.ty; n.moveT = 0; n.stepParity ^= 1; }
      continue;
    }
    const w = n.def.wander;
    if (!w || Game.freezeNPCs || Game.top() !== Game.overworld) continue;
    n.wanderT -= dt;
    if (n.wanderT > 0) continue;
    n.wanderT = 1.5 + Math.random() * 2.5;
    const dirs = Object.keys(DIRS), d = dirs[Math.floor(Math.random() * 4)];
    n.dir = d;
    const nx = n.x + DIRS[d][0], ny = n.y + DIRS[d][1];
    if (nx < w.x0 || nx > w.x1 || ny < w.y0 || ny > w.y1) continue;
    if (!Game.isWalkable(Game.map, nx, ny, n)) continue;

    for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) {

      grd.addColorStop(0, 'rgba(200,190,255,0.16)'); grd.addColorStop(1, 'rgba(200,190,255,0)');

let lastT = 0, errorCount = 0;
function frame(ts) {
  const dt = Math.min(0.05, lastT ? (ts - lastT) / 1000 : 0.016); lastT = ts;
  try {
    Game.time += dt;
    const top = Game.top(); if (top) top.update(dt);
    Sound.update(dt);   // ambience per area (14_audio.js)
    let start = Game.scenes.length - 1;
    while (start > 0 && !Game.scenes[start].opaque) start--;
    for (let i = Math.max(0, start); i < Game.scenes.length; i++) Game.scenes[i].draw(Game.ctx);
  } catch (e) { if (errorCount++ < 5) console.error(e); }
  requestAnimationFrame(frame);
}

// A battle is a queue of small steps processed in order:
//   {say}  caption that keeps going      {msg}  caption that waits for A      {anim}/{wait}  timed animation
//   {fn}   runs code *when reached*; may return more steps, which run next  {prompt}  a menu (yes/no, forget, party)
// Because {fn} steps run lazily, damage/XP/level-ups happen exactly in the order the player reads about them.

// ---- formulas (DESIGN.md "Battles") ----
function effStat(value, stage) { return stage >= 0 ? value * Math.pow(1.5, stage) : value / Math.pow(1.5, -stage); }
// floor(((2L/5 + 2) x Power x Atk / Def) / 50) + 2, x STAB 1.5, x type multiplier, x random 0.85-1.0 (rng omitted = 1.0)
function calcDamage(att, attStages, def, defStages, moveId, rng) {
  const mv = MOVES[moveId];
  const A = effStat(att.stats.atk, (attStages && attStages.atk) || 0), D = effStat(def.stats.def, (defStages && defStages.def) || 0);
  const stab = mv.type === SPECIES[att.species].type ? 1.5 : 1;
  const mult = typeMultiplier(mv.type, SPECIES[def.species].type);
  const rand = rng ? 0.85 + rng() * 0.15 : 1;
  const base = Math.floor(((2 * att.level / 5 + 2) * mv.power * A / D) / 50) + 2;
  return { dmg: Math.max(1, Math.floor(base * stab * mult * rand)), mult };

// Run from a wild creature: always works if you're at least as fast; otherwise speed-based odds that improve each try.
function escapeChance(playerSpd, foeSpd, failedTries = 0) {
  if (playerSpd >= foeSpd) return 1;
  return Math.min(1, 0.25 + 0.75 * playerSpd / foeSpd + 0.25 * failedTries);
}

// Catching (DESIGN.md): ((3*maxHP - 2*HP) / (3*maxHP)) x (catchRate / 255) x ball bonus, at least 5%. catchRate 0 = never.
function catchChance(c, ballId) {
  const rate = SPECIES[c.species].catchRate;
  if (!rate) return 0;
  const M = c.stats.hp, H = Math.max(0, c.hp);
  return clamp(((3 * M - 2 * H) / (3 * M)) * (rate / 255) * ITEMS[ballId].catchBonus, 0.05, 1);
}

  tryRun() {
    if (this.kind === 'trainer') { this.run([{ msg: "No! There's no running from a trainer battle!" }, { fn: () => this.startTurn() }]); return; }
    const pS = effStat(this.pmon.stats.spd, this.stages.player.spd), fS = effStat(this.foe.stats.spd, this.stages.foe.spd);
    if (Game.rng() < escapeChance(pS, fS, this.failedRuns)) { this.run([{ msg: 'Got away safely!', sfx: 'run' }, { fn: () => this.finish('run') }]); return; }
    this.failedRuns++;
    this.run([{ msg: "Couldn't get away!" }, { fn: () => this.act('foe', this.pickFoeMove(), this.foe) }, { fn: () => this.startTurn() }]);
  }
  // ---------- bag: jars (catching) and tonics ----------
  useItem(id) {
    const bag = Game.state.bag, it = ITEMS[id];
    if (!bag[id]) { this.run([{ msg: `You don't have any ${it.name}s.` }, { fn: () => this.startTurn() }]); return; }
    if (it.kind === 'ball') {
      if (this.kind === 'trainer') { this.run([{ msg: 'You can\'t catch a trainer\'s creature! That would be rude.' }, { fn: () => this.startTurn() }]); return; }
      this.throwBall(id); return;
    }
    if (it.kind === 'heal') {
      this.run([{ prompt: 'party', forced: false, text: `Use ${it.name} on which creature?`,
        pick: (i) => {
          const c = Game.state.party[i], n = SPECIES[c.species].name;
          if (c.hp <= 0) return [{ msg: `${n} is too sleepy to drink it. Rest at a Lantern House.` }, { fn: () => this.startTurn() }];
          if (c.hp >= c.stats.hp) return [{ msg: `${n}'s HP is already full!` }, { fn: () => this.startTurn() }];
          const heal = Math.min(it.heal, c.stats.hp - c.hp); c.hp += heal; bag[id]--;
          return [i === this.pi ? { anim: 'hp', side: 'player', to: c.hp } : null, { msg: `${n} recovered ${heal} HP!` },
            { fn: () => this.act('foe', this.pickFoeMove(), this.foe) }, { fn: () => this.startTurn() }].filter(Boolean);
        },
        cancel: () => [{ fn: () => this.startTurn() }] }]);
    }
  }
  throwBall(id) {
    const bag = Game.state.bag, it = ITEMS[id], foe = this.foe, name = SPECIES[foe.species].name;
    bag[id]--;
    const chance = catchChance(foe, id);
    if (chance <= 0) {
      this.run([{ say: `You threw a ${it.name}!` }, { anim: 'throw', ball: id }, { msg: `${name} swatted the ${it.name} away! It can't be caught.` },
        { fn: () => { this.ball = null; return this.act('foe', this.pickFoeMove(), foe); } }, { fn: () => this.startTurn() }]);
      return;
    }
    const r = Game.rng(), caught = r < chance;
    const wobbles = caught ? 3 : Math.min(2, Math.floor(3 * chance / Math.max(r, 1e-6)));
    Game.lastCatch = { species: foe.species, chance, roll: r, caught, wobbles, ball: id };
    const items = [{ say: `You threw a ${it.name}!` }, { anim: 'throw', ball: id }, { anim: 'absorb' }];
    for (let w = 0; w < wobbles; w++) items.push({ anim: 'wobble' });
    if (caught) {
      items.push({ anim: 'click' }, { msg: `Gotcha! ${name} was caught!` }, { fn: () => {
        const where = addCreature(foe);
        const more = [];
        if (where === 'storage') more.push({ msg: `Your party is full, so ${name} went to storage at the Lantern House.` });
        if (this.special && this.special.onCatch) more.push(...(this.special.onCatch(foe) || []));
        more.push({ fn: () => this.finish('caught') });
        return more;
      } });
    } else {
      items.push({ anim: 'breakout' }, { msg: ['Oh no! It broke free right away!', 'Aww! It looked like it was caught!', 'Argh! So close!'][wobbles] },
        { fn: () => this.act('foe', this.pickFoeMove(), foe) }, { fn: () => this.startTurn() });
    }
    this.run(items);
  }
  finish(result) {
    if (this.ended) return [];
    this.ended = true; this.result = result; this.queue = []; this.mode = 'done'; this.prompt = null;
    Game.lastBattleResult = result;
    Game.battleCount = (Game.battleCount || 0) + 1;
    const fade = new FadeScene(() => {
      Game.popScene(this);
      if (result === 'lose') doBlackout(fade);
      if (this.onEnd) this.onEnd(result, this);
      if (typeof Quests !== 'undefined') Game.whenIdle(() => Quests.refresh(Game));
    }, result === 'lose' ? 1.6 : 0.8);
    Game.pushScene(fade);
    return [];
  }

  // ---------- prompts & input ----------
  openPrompt(it) {
    this.prompt = it; this.mode = it.prompt;
    this.setCaption(it.text || ''); this.captionShown = this.caption.length;
    if (it.prompt === 'yesno') this.yesNo = 0;
    if (it.prompt === 'forget') this.forgetCursor = 0;
    if (it.prompt === 'party') { const p = Game.state.party; this.partyCursor = p[this.pi] && p[this.pi].hp > 0 ? this.pi : Math.max(0, p.findIndex(c => c.hp > 0)); }
  }
  resolvePrompt(items) { this.prompt = null; this.mode = 'queue'; this.queue.unshift(...(items || [])); }
  onPress(k) {
    if (k === 'start') k = 'a';
    const P = this.prompt;
    switch (this.mode) {
      case 'queue':
        if (this.cur && this.cur.msg !== undefined && (k === 'a' || k === 'b')) {
          if (this.captionShown < this.caption.length) this.captionShown = this.caption.length; else this.cur = null;
        }
        break;
      case 'main':
        if (k === 'up' || k === 'down') this.menu ^= 2;
        else if (k === 'left' || k === 'right') this.menu ^= 1;
        else if (k === 'a') this.selectMain(this.menu);
        break;
      case 'fight': {
        const n = this.pmon.moves.length;
        if (k === 'up') this.moveCursor = (this.moveCursor + n - 1) % n;
        else if (k === 'down') this.moveCursor = (this.moveCursor + 1) % n;
        else if (k === 'b') this.startTurn();
        else if (k === 'a') this.chooseMove(this.moveCursor);
        break;
      }
      case 'yesno':
        if (k === 'up' || k === 'down') this.yesNo ^= 1;
        else if (k === 'a') this.resolvePrompt(this.yesNo === 0 ? P.yes() : P.no());
        else if (k === 'b') this.resolvePrompt(P.no());
        break;
      case 'forget': {
        const n = P.creature.moves.length + 1;   // moves + CANCEL
        if (k === 'up') this.forgetCursor = (this.forgetCursor + n - 1) % n;
        else if (k === 'down') this.forgetCursor = (this.forgetCursor + 1) % n;
        else if (k === 'b') this.resolvePrompt(P.cancel());
        else if (k === 'a') this.resolvePrompt(this.forgetCursor === n - 1 ? P.cancel() : P.pick(this.forgetCursor));
        break;
      }
      case 'bag': {
        const n = BAG_ORDER.length + 1;   // items + CANCEL
        if (k === 'up') this.bagCursor = (this.bagCursor + n - 1) % n;
        else if (k === 'down') this.bagCursor = (this.bagCursor + 1) % n;
        else if (k === 'b' || (k === 'a' && this.bagCursor === n - 1)) this.startTurn();
        else if (k === 'a') this.useItem(BAG_ORDER[this.bagCursor]);
        break;
      }
      case 'party': {
        const n = Game.state.party.length;
        if (k === 'up') this.partyCursor = (this.partyCursor + n - 1) % n;
        else if (k === 'down') this.partyCursor = (this.partyCursor + 1) % n;
        else if (k === 'b' && P.cancel) this.resolvePrompt(P.cancel());
        else if (k === 'a') this.resolvePrompt(P.pick(this.partyCursor));
        break;
      }
    }
  }
  selectMain(i) {
    if (i === 0) { this.mode = 'fight'; this.moveCursor = Math.min(this.moveCursor, this.pmon.moves.length - 1); }
    else if (i === 1) { this.mode = 'bag'; this.bagCursor = Math.min(this.bagCursor || 0, BAG_ORDER.length); this.setCaption('Use which item?', false); this.captionShown = this.caption.length; }
    else if (i === 2) this.run([this.partyPrompt(false)]);
    else this.tryRun();
  }

  // ---------- drawing ----------
  drawMon(L, side) {
    const f = this.fx[side], c = this.mon(side);
    if (!c || f.gone || f.hidden) return;
    const full = side === 'player' ? 48 : 32, bx = side === 'player' ? 14 : 108, by = side === 'player' ? 50 : 12;
    const size = Math.max(2, Math.round(full * f.scale));
    const x = bx + Math.round((full - size) / 2) + f.offX, y = by + (full - size) + f.offY;
    const img = side === 'player' ? flippedSprite(c.species) : CREATURE_SPRITES[c.species];
    L.save(); L.beginPath(); L.rect(0, 0, SCREEN_W, by + full); L.clip();
    const bob = (this.mode === 'main' || this.mode === 'fight') && side === 'player' ? (Math.floor(this.t * 2.5) % 2) : 0;
    L.drawImage(img, x, y + bob, size, size);
    if (f.scale < 1) { L.globalAlpha = 1 - f.scale; L.fillStyle = '#f2ecff'; L.fillRect(x, y, size, size); L.globalAlpha = 1; }
    const a = this.cur && this.cur.anim;
    if ((a === 'statUp' || a === 'statDown') && this.cur.side === side) {   // shimmer lines rising / falling over the sprite
      const p = this.cur.t / this.cur.dur;
      L.fillStyle = a === 'statUp' ? 'rgba(255,212,107,0.8)' : 'rgba(120,216,255,0.8)';
      for (let k = 0; k < 4; k++) {
        const yy = ((a === 'statUp' ? 1 - p : p) * full + k * full / 4) % full;
        L.fillRect(x + 2, y + Math.round(yy), size - 4, 1);
      }
    }
    L.restore();
  }
  draw(g) {
    if (this.kind === 'xp') {   // quest XP over the map: just the creature card, text and prompts
      g.fillStyle = 'rgba(7,5,15,0.55)'; g.fillRect(0, 0, 640, 576);
      if (this.pmon) this.drawPlayerBox(g);
      this.drawCaption(g, 0, 392, 640, 184);
      if (this.cur && this.cur.statBox) this.drawStatBox(g, this.cur.statBox);
      if (this.mode === 'forget') this.drawForget(g);
      if (this.mode === 'yesno') this.drawYesNo(g);
      return;
    }
    const L = Game.lctx;
    L.fillStyle = '#000'; L.fillRect(0, 0, SCREEN_W, SCREEN_H);
    L.drawImage(battleBg, 0, 0);
    for (let i = 0; i < 10; i++) {   // drifting wisps
      const x = ((hash2(i, 1, 9) * 160 + Math.sin(this.t * 0.7 + i) * 10) + 160) % 160;
      const y = ((hash2(i, 2, 9) * 90 - this.t * (3 + i % 4)) % 90 + 90) % 90;
      L.fillStyle = `rgba(${i % 3 ? '182,255,106' : '120,216,255'},${(0.3 + 0.3 * Math.sin(this.t * 2 + i)).toFixed(2)})`; L.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    if (this.trainerFx.visible && this.trainerImg) L.drawImage(this.trainerImg, 108 + this.trainerFx.offX, 12, 32, 32);
    this.drawMon(L, 'foe'); this.drawMon(L, 'player');
    if (this.ball && this.ball.visible) {
      L.drawImage(jarSprite(this.ball.id), this.ball.x + this.ball.dx, this.ball.y);
      if (this.cur && this.cur.anim === 'click') {   // little sparkles when the jar seals
        const p = this.cur.t / this.cur.dur; L.fillStyle = '#fff1a8';
        for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + 0.6; L.fillRect(Math.round(this.ball.x + 4 + Math.cos(a) * (4 + p * 8)), Math.round(this.ball.y + 5 + Math.sin(a) * (4 + p * 8)), 1, 1); }
      }
    }
    g.imageSmoothingEnabled = false;
    g.drawImage(Game.low, 0, 0, SCREEN_W * SCALE, SCREEN_H * SCALE);
    if (this.fx.foe.box && !this.fx.foe.gone) this.drawFoeBox(g);
    if (this.fx.player.box && !this.fx.player.gone) this.drawPlayerBox(g);
    this.drawBottom(g);
    if (this.cur && this.cur.statBox) this.drawStatBox(g, this.cur.statBox);
    if (this.mode === 'party') this.drawParty(g);
    if (this.mode === 'forget') this.drawForget(g);
    if (this.mode === 'yesno') this.drawYesNo(g);
    if (this.t < 0.3) { g.fillStyle = `rgba(0,0,0,${(1 - this.t / 0.3).toFixed(3)})`; g.fillRect(0, 0, 640, 576); }   // in from the flash's black wipe
  }
  hpBar(g, x, y, w, frac) {
    frac = clamp(frac, 0, 1);
    g.fillStyle = PAL.outline; g.fillRect(x - 4, y - 4, w + 8, 20);
    g.fillStyle = '#2a2140'; g.fillRect(x, y, w, 12);
    g.fillStyle = frac > 0.5 ? HP_COLORS.ok : frac > 0.2 ? HP_COLORS.mid : HP_COLORS.low;
    g.fillRect(x, y, Math.round(w * frac / 4) * 4, 12);
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(x, y, Math.round(w * frac / 4) * 4, 4);
  }
  drawNameLine(g, c, x, y, w) {
    g.font = FONT; g.textAlign = 'left'; g.fillStyle = PAL.text; g.fillText(SPECIES[c.species].name, x, y);
    g.textAlign = 'right'; g.fillStyle = TYPES[SPECIES[c.species].type].color; g.font = BFONT_S; g.fillText('Lv' + c.level, x + w, y);
    g.textAlign = 'left';
  }
  partyDots(g, list, x, y) {
    list.forEach((c, i) => { g.fillStyle = PAL.outline; g.fillRect(x + i * 20 - 2, y - 2, 16, 16); g.fillStyle = c.hp > 0 ? PAL.flame : '#4a3a5a'; g.fillRect(x + i * 20, y, 12, 12); });
  }
  drawFoeBox(g) {
    const c = this.foe;
    drawBox(g, 12, 12, 336, 104);
    this.drawNameLine(g, c, 36, 52, 288);
    g.font = BFONT_S; g.fillStyle = PAL.flame; g.fillText('HP', 36, 90);
    this.hpBar(g, 80, 76, 244, this.shownHp.foe / c.stats.hp);
    if (this.kind === 'trainer') this.partyDots(g, this.foes, 28, 128);
  }
  drawPlayerBox(g) {
    const c = this.pmon;
    drawBox(g, 292, 232, 336, 156);
    this.drawNameLine(g, c, 316, 272, 288);
    g.font = BFONT_S; g.fillStyle = PAL.flame; g.fillText('HP', 316, 310);
    this.hpBar(g, 360, 296, 244, this.shownHp.player / c.stats.hp);
    g.textAlign = 'right'; g.font = FONT; g.fillStyle = PAL.text;
    g.fillText(`${Math.ceil(this.shownHp.player)}/${c.stats.hp}`, 604, 344); g.textAlign = 'left';
    // XP bar
    const lo = xpForLevel(c.level), hi = xpForLevel(c.level + 1);
    const frac = c.level >= MAX_LEVEL ? 1 : clamp((this.shownXp - lo) / (hi - lo), 0, 1);
    g.font = BFONT_S; g.fillStyle = XP_COLOR; g.fillText('XP', 316, 372);
    g.fillStyle = PAL.outline; g.fillRect(356, 358, 252, 16); g.fillStyle = '#1b2452'; g.fillRect(360, 362, 244, 8);
    g.fillStyle = XP_COLOR; g.fillRect(360, 362, Math.round(244 * frac / 4) * 4, 8);
    if (this.kind === 'trainer') this.partyDots(g, Game.state.party, 312, 208);
  }
  drawCaption(g, x, y, w, h) {
    drawBox(g, x, y, w, h);
    g.font = FONT; g.fillStyle = PAL.text;
    if (!this.captionLines || this.captionLines.w !== w) { this.captionLines = wrapText(g, this.caption, w - 52); this.captionLines.w = w; }
    let remaining = Math.floor(this.captionShown);
    this.captionLines.forEach((line, i) => { g.fillText(line.slice(0, Math.max(0, remaining)), x + 26, y + 58 + i * 40); remaining -= line.length + 1; });
    if (this.cur && this.cur.msg !== undefined && this.captionShown >= this.caption.length && Math.floor(Game.time * 3) % 2 === 0) {
      g.fillStyle = PAL.boxEdge; const ax = x + w - 36, ay = y + h - 30;
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(ax + 16, ay); g.lineTo(ax + 8, ay + 10); g.fill();
    }
  }
  drawBottom(g) {
    if (this.mode === 'main') {
      this.drawCaption(g, 0, 392, 344, 184);
      drawBox(g, 336, 392, 304, 184);
      g.font = FONT;
      ['FIGHT', 'BAG', 'SWITCH', 'RUN'].forEach((label, i) => {
        const x = 384 + (i % 2) * 128, y = 460 + Math.floor(i / 2) * 64;
        g.fillStyle = i === this.menu ? PAL.flame2 : PAL.text; g.fillText(label, x, y);
        if (i === this.menu) g.fillText('\u25b6', x - 26, y);
      });
    } else if (this.mode === 'fight') {
      const moves = this.pmon.moves;
      drawBox(g, 0, 392, 432, 184);
      g.font = FONT;
      moves.forEach((m, i) => {
        const y = 440 + i * 38;
        g.fillStyle = i === this.moveCursor ? PAL.flame2 : PAL.text; g.fillText(MOVES[m].name, 56, y);
        if (i === this.moveCursor) g.fillText('\u25b6', 28, y);
      });
      const mv = MOVES[moves[this.moveCursor]];
      drawBox(g, 424, 392, 216, 184);
      g.font = FONT; g.fillStyle = TYPES[mv.type].color; g.fillText(TYPES[mv.type].name.toUpperCase(), 452, 446);
      g.font = BFONT_S; g.fillStyle = PAL.text;
      g.fillText(mv.power ? `POWER ${mv.power}` : 'STATUS', 452, 490);
      g.fillText(`ACC   ${mv.acc}`, 452, 522);
      const mult = mv.power ? typeMultiplier(mv.type, SPECIES[this.foe.species].type) : 1;   // gentle hint for young players
      if (mult !== 1) { g.fillStyle = mult > 1 ? HP_COLORS.ok : PAL.textDim; g.fillText(mult > 1 ? 'Strong!' : 'Weak...', 452, 552); }
    } else if (this.mode === 'bag') {
      const bag = Game.state.bag;
      drawBox(g, 0, 392, 432, 184);
      g.font = FONT;
      [...BAG_ORDER, null].forEach((id, i) => {
        const y = 440 + i * 38, sel = i === this.bagCursor;
        g.fillStyle = sel ? PAL.flame2 : (id && !bag[id] ? PAL.textDim : PAL.text);
        g.fillText(id ? ITEMS[id].name : 'CANCEL', 56, y);
        if (id) { g.textAlign = 'right'; g.fillText('x' + (bag[id] || 0), 404, y); g.textAlign = 'left'; }
        if (sel) g.fillText('\u25b6', 28, y);
      });
      drawBox(g, 424, 392, 216, 184);
      const id = BAG_ORDER[this.bagCursor];
      g.font = BFONT_S; g.fillStyle = PAL.text;
      const desc = id ? ITEMS[id].desc + (ITEMS[id].kind === 'ball' && this.kind !== 'trainer' ? ` Odds now: ${Math.round(catchChance(this.foe, id) * 100)}%` : '') : 'Back to the menu.';
      wrapText(g, desc, 170).slice(0, 5).forEach((line, i) => g.fillText(line, 448, 436 + i * 26));
    } else this.drawCaption(g, 0, 392, 640, 184);
  }
  drawYesNo(g) {
    drawBox(g, 480, 244, 152, 140);
    g.font = FONT;
    ['YES', 'NO'].forEach((label, i) => {
      const y = 298 + i * 50; g.fillStyle = i === this.yesNo ? PAL.flame2 : PAL.text; g.fillText(label, 532, y);
      if (i === this.yesNo) g.fillText('\u25b6', 506, y);
    });
  }
  drawStatBox(g, sb) {
    drawBox(g, 356, 12, 272, 208);
    g.font = BFONT_S;
    ['hp', 'atk', 'def', 'spd'].forEach((k, i) => {
      const y = 58 + i * 42;
      g.fillStyle = PAL.textDim; g.fillText(k.toUpperCase(), 384, y);
      g.fillStyle = PAL.text; g.textAlign = 'right'; g.fillText(String(sb.stats[k]), 520, y);
      g.fillStyle = HP_COLORS.ok; g.fillText('+' + sb.gains[k], 600, y); g.textAlign = 'left';
    });
  }
  drawParty(g) {
    const party = Game.state.party;
    g.fillStyle = 'rgba(7,5,15,0.96)'; g.fillRect(0, 0, 640, 392);
    drawBox(g, 0, 0, 640, 392);
    party.forEach((c, i) => {
      const y = 20 + i * 60, sel = i === this.partyCursor;
      if (sel) { g.fillStyle = 'rgba(185,168,255,0.14)'; g.fillRect(16, y, 608, 58); }
      g.imageSmoothingEnabled = false; g.drawImage(CREATURE_SPRITES[c.species], 52, y + 5, 48, 48);
      g.font = FONT; g.fillStyle = sel ? PAL.flame2 : PAL.text; g.fillText(SPECIES[c.species].name, 116, y + 30);
      if (sel) g.fillText('\u25b6', 24, y + 38);
      g.font = BFONT_S; g.fillStyle = TYPES[SPECIES[c.species].type].color; g.fillText('Lv' + c.level, 290, y + 30);
      g.fillStyle = PAL.textDim; g.fillText(i === this.pi && c.hp > 0 ? 'IN BATTLE' : c.hp <= 0 ? 'FAINTED' : '', 116, y + 52);
      this.hpBar(g, 360, y + 18, 160, c.hp / c.stats.hp);
      g.fillStyle = PAL.text; g.textAlign = 'right'; g.fillText(`${c.hp}/${c.stats.hp}`, 608, y + 32); g.textAlign = 'left';
    });
  }
  drawForget(g) {
    const P = this.prompt, c = P.creature;
    drawBox(g, 16, 16, 608, 368);
    g.font = BFONT_S; g.fillStyle = PAL.textDim;
    g.fillText('MOVE', 72, 56); g.fillText('TYPE', 352, 56); g.fillText('POWER', 492, 56);
    const row = (m, y, color, label) => {
      const mv = MOVES[m];
      g.font = FONT; g.fillStyle = color; g.fillText(label || mv.name, 72, y);
      g.font = BFONT_S; g.fillStyle = TYPES[mv.type].color; g.fillText(TYPES[mv.type].name, 352, y);
      g.fillStyle = PAL.text; g.fillText(mv.power ? String(mv.power) : '-', 512, y);
    };
    c.moves.forEach((m, i) => {
      const y = 100 + i * 44, sel = i === this.forgetCursor;
      row(m, y, sel ? PAL.flame2 : PAL.text);
      if (sel) { g.font = FONT; g.fillStyle = PAL.flame2; g.fillText('\u25b6', 44, y); }
    });
    const cy = 100 + c.moves.length * 44, csel = this.forgetCursor === c.moves.length;
    g.font = FONT; g.fillStyle = csel ? PAL.flame2 : PAL.textDim; g.fillText('CANCEL', 72, cy); if (csel) g.fillText('\u25b6', 44, cy);
    g.fillStyle = PAL.boxEdge2; g.fillRect(40, cy + 22, 560, 4);
    g.font = BFONT_S; g.fillStyle = HP_COLORS.ok; g.fillText('NEW:', 72, cy + 62);
    const nm = MOVES[P.move]; g.font = FONT; g.fillStyle = PAL.flame; g.fillText(nm.name, 132, cy + 62);
    g.font = BFONT_S; g.fillStyle = TYPES[nm.type].color; g.fillText(TYPES[nm.type].name, 352, cy + 62);
    g.fillStyle = PAL.text; g.fillText(nm.power ? String(nm.power) : '-', 512, cy + 62);
  }

// ===================== TOUCH CONTROLS (09_touch.js) =====================
/* On-screen D-pad + A / B / START for phones and tablets, plus scaling the 640x576 canvas to fit any screen.
   Drives the game only through window.gameInput (see the INPUT HOOK banner in the ENGINE part).
   - The canvas shrinks to fit the window on every device (never grows past 640 px wide), keeping its 10:9 shape.
   - Buttons appear only on touch screens: under the game in portrait, on either side of it in landscape.
   - The D-pad is one pad: slide your thumb around it to change direction without lifting.
   - Tapping the game screen on the title screen starts the game. */
(function setupTouchControls() {
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);

  const css = document.createElement('style');
  css.textContent = `
    #screen { width: min(640px, 100vw, calc(100vh * 10 / 9)); height: auto; aspect-ratio: 10 / 9; max-width: 100vw; }
    body.touch { overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
                 -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; height: 100dvh; }
    body.touch #help { display: none; }
    body.touch #screen { box-shadow: 0 0 0 2px #2a2140, 0 0 24px 4px #1b1233; }
    #touchpad { display: none; }
    body.touch #touchpad { display: flex; width: 100vw; max-width: 640px; box-sizing: border-box; padding: 16px 22px;
                           justify-content: space-between; align-items: center; }
    .tc-dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: #120d24;
               box-shadow: inset 0 0 0 2px #2a2140; touch-action: none; }
    .tc-arrow { position: absolute; width: 50px; height: 50px; background: #2a2140; border-radius: 8px; color: #b9a8ff;
                font: bold 20px monospace; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .tc-arrow.on, .tc-btn.on { background: #5a4a8a; color: #f2ecff; }
    .tc-up { left: 50px; top: 0; } .tc-down { left: 50px; bottom: 0; } .tc-left { left: 0; top: 50px; } .tc-right { right: 0; top: 50px; }
    .tc-right-side { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
    .tc-ab { display: flex; gap: 14px; align-items: center; }
    .tc-btn { width: 66px; height: 66px; border-radius: 50%; background: #2a2140; color: #f2ecff; border: none;
              font: bold 22px monospace; box-shadow: 0 3px 0 #0b0818; touch-action: none; }
    .tc-btn.tc-a { margin-bottom: 30px; background: #4a2d60; }
    .tc-btn.tc-start { width: 86px; height: 32px; border-radius: 16px; font-size: 13px; letter-spacing: 1px; }
    @media (orientation: landscape) {
      body.touch { flex-direction: row; }
      body.touch #screen { width: min(640px, calc(100vw - 360px), calc(100dvh * 10 / 9)); }
      body.touch #touchpad { position: fixed; inset: 0; max-width: none; padding: 0 16px; pointer-events: none; }
      body.touch #touchpad > * { pointer-events: auto; }
    }`;
  document.head.appendChild(css);
  if (!isTouch) return;
  document.body.classList.add('touch');

  const input = window.gameInput;
  const buzz = () => { if (navigator.vibrate) navigator.vibrate(8); };
  const pad = document.createElement('div'); pad.id = 'touchpad';
  pad.innerHTML = `
    <div class="tc-dpad" aria-label="Direction pad">
      <div class="tc-arrow tc-up">&#9650;</div><div class="tc-arrow tc-down">&#9660;</div>
      <div class="tc-arrow tc-left">&#9664;</div><div class="tc-arrow tc-right">&#9654;</div>
    </div>
    <div class="tc-right-side">
      <div class="tc-ab"><button class="tc-btn tc-b" aria-label="B, back">B</button><button class="tc-btn tc-a" aria-label="A, talk or confirm">A</button></div>
      <button class="tc-btn tc-start" aria-label="Start">START</button>
    </div>`;
  document.body.appendChild(pad);

  // ---- D-pad: one pointer, direction from the angle to the pad's center, slide to change ----
  const dpad = pad.querySelector('.tc-dpad');
  const arrows = { up: pad.querySelector('.tc-up'), down: pad.querySelector('.tc-down'), left: pad.querySelector('.tc-left'), right: pad.querySelector('.tc-right') };
  let dir = null, dpadPointer = null;
  function setDir(next) {
    if (next === dir) return;
    if (dir) { input.release(dir); arrows[dir].classList.remove('on'); }
    dir = next;
    if (dir) { input.press(dir); arrows[dir].classList.add('on'); buzz(); }
  }
  function dirFromEvent(e) {
    const r = dpad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) return dir;       // small dead zone in the middle keeps the current direction
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
  dpad.addEventListener('pointerdown', (e) => { e.preventDefault(); dpadPointer = e.pointerId; dpad.setPointerCapture(e.pointerId); setDir(dirFromEvent(e)); });
  dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dpadPointer) setDir(dirFromEvent(e)); });
  const dpadUp = (e) => { if (e.pointerId === dpadPointer) { dpadPointer = null; setDir(null); } };
  dpad.addEventListener('pointerup', dpadUp); dpad.addEventListener('pointercancel', dpadUp); dpad.addEventListener('lostpointercapture', dpadUp);

  // ---- A / B / START: press on touch-down, release on touch-up ----
  [['.tc-a', 'a'], ['.tc-b', 'b'], ['.tc-start', 'start']].forEach(([sel, key]) => {
    const el = pad.querySelector(sel);
    let held = null;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); held = e.pointerId; el.setPointerCapture(e.pointerId); el.classList.add('on'); buzz(); input.press(key); });
    const up = (e) => { if (e.pointerId !== held) return; held = null; el.classList.remove('on'); input.release(key); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });

  // ---- Tap the game screen to start from the title screen ----
  document.getElementById('screen').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (window.GAME && GAME.scene() === 'TitleScene') input.tap('a');
  });

  // ---- Never leave a direction stuck (app switch, notification, rotate) ----
  const releaseAll = () => { setDir(null); input.releaseAll(); pad.querySelectorAll('.on').forEach(el => el.classList.remove('on')); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  window.addEventListener('orientationchange', releaseAll);
  document.addEventListener('contextmenu', (e) => e.preventDefault());   // long-press menu would interrupt a held D-pad
})();

// ===================== STORY DATA (STORY.md sections 3, 5, 6) =====================
// Quest definitions, lore pages, per-NPC dialogue by story stage, Nib's lines, and the story's inspect hooks.
// All quest progress lives in Game.state.flags; Quests (11_quests.js) derives everything else from them.

const flagOf = (G, name) => G.state.flags[name];
const QF = (name) => (G) => !!flagOf(G, name);                    // flag is set
const QN = (name, n) => (G) => (flagOf(G, name) || 0) >= n;       // counter reached n
// Lantern House keepers hand out 3 spare Soul Jars when you have a creature but no catchers at all.
const Story_outOfJars = (G) => G.state.party.length > 0 && !(G.state.bag.soul_jar > 0) && !(G.state.bag.spirit_lantern > 0);
const setFlags = (G, ...names) => { for (const n of names) G.state.flags[n] = true; };
// Tiny condition language used by LORE (`when: 'pactStones>=3 && !bossDefeated'`).
function storyCond(expr, G) {
  if (!expr) return true;
  if (typeof expr === 'function') return !!expr(G);
  return expr.split('&&').every(part => {
    const t = part.trim(), m = t.match(/^(\w+)\s*>=\s*(\d+)$/);
    if (m) return (flagOf(G, m[1]) || 0) >= +m[2];
    return t[0] === '!' ? !flagOf(G, t.slice(1)) : !!flagOf(G, t);
  });
}
// Counters are always recomputed from their numbered flags, so a tile can't count twice.
function recountFlags(G) {
  const f = G.state.flags, count = (p, n) => { let c = 0; for (let i = 1; i <= n; i++) if (f[p + i]) c++; return c; };
  f.lanternsLit = count('lantern', 4); f.glowcaps = count('glowcap', 3); f.pactStones = count('pact', 3);
  f.hasHushling = G.state.party.some(c => c.species === 'hushling');
}

// ---------------- Story: inspect hooks + scripted scenes ----------------
const GLOWCAPS = [[10, 38], [24, 48], [22, 33]];
const PACT_STONES = [[21, 23], [10, 33], [3, 3]];
const SHRINE = [19, 55];
function loreAt(mapId, key) {
  for (const [id, L] of Object.entries(LORE)) {
    if (L.map !== mapId) continue;
    if (Array.isArray(L.at) ? L.at.includes(key) : L.at === key) return [id, L];
  }

}
const Story = {
  // Mark a lore page read; toasts "LORE PAGE FOUND (n/47)" the first time.
  readLore(id, quiet) {
    const st = Game.state;
    if (!LORE[id] || LORE[id].template || st.lore[id]) return false;
    st.lore[id] = true;
    if (!quiet) Game.toast(`LORE PAGE FOUND (${Story.loreCount()}/${LORE_IDS.length})`);
    return true;
  },
  loreCount() { return LORE_IDS.filter(id => Game.state.lore[id]).length; },
  // Pages of a lore entry right now, or null when its `when` fails (locked pages are returned instead if present).
  lorePages(L, G) {
    if (L.alt && storyCond(L.alt.when, G)) return { pages: L.alt.pages, read: true };
    if (!storyCond(L.when, G)) return L.locked ? { pages: L.locked, read: false } : null;
    const pages = L.pages.slice();
    if (L.after && storyCond(L.after.when, G)) pages.push(...L.after.pages);
    return { pages, read: true };
  },
  existingInspect(G, map, fx, fy) {
    const ins = map.inspect[`${fx},${fy}`];

  },
  // Called first by OverworldScene.interact. Returns true when it handled the tile.
  inspect(G, fx, fy) {
    const map = G.map, f = G.state.flags, key = `${fx},${fy}`, ch = tileAt(map, fx, fy);
    if (map.id === 'overworld') {
      // snuffed / relit trail lanterns
      const li = TRAIL_LANTERNS.findIndex(([x, y]) => x === fx && y === fy);
      if (li >= 0) {
        const n = li + 1;
        if (f['lantern' + n]) { G.say(LORE.lit_lantern.pages); return true; }
        if (!f.hasTaper) return false;   // generic "if you had a taper..." text
        f['lantern' + n] = true; recountFlags(G); applyWorldState(map);
        Story.readLore('rhyme_' + n, true);
        const pages = LORE.lantern_relight.pages.map(p => p.replace('{rhymeLine}', LORE['rhyme_' + n].pages[0]).replace('{n}', f.lanternsLit));
        G.lastRelight = n;
        G.say(pages, { onClose: () => Quests.refresh(G) });
        return true;
      }
      // Glowcap Soup (only once Pip asked)
      const gi = GLOWCAPS.findIndex(([x, y]) => x === fx && y === fy);
      if (gi >= 0 && f.pipAsked && !f.pipSoup) {
        const n = gi + 1;
        if (f['glowcap' + n]) { G.say(['You already picked the best glowcap here.']); return true; }
        f['glowcap' + n] = true; recountFlags(G);
        if (n === 3) {   // the one that giggles
          G.say(['You reach for the glowcap... it GIGGLES!', 'It\'s a Mossgrub wearing it as a hat!',
            `(The Mossgrub drops the glowcap when it lunges. Glowcaps: ${f.glowcaps} of 3)`],
            { onClose: () => { if (G.state.party.some(c => c.hp > 0)) G.hooks.startWildEncounter('mossgrub', 5); Quests.refresh(G); } });
        } else G.say([`You pick a plump, glowing glowcap. It hums politely. (Glowcaps: ${f.glowcaps} of 3)`], { onClose: () => Quests.refresh(G) });
        return true;
      }
      if (fx === SHRINE[0] && fy === SHRINE[1]) { Story.shrine(); return true; }
      // Pumble with a Hushling in the party
      if (key === '26,67' && !f.pumbleHushed && G.state.party.some(c => c.species === 'hushling')) {
        Story.readLore('pumble_grave');
        G.say(['Here lies Pumble. He\'s just resting his eyes.', '(A tremendous snore rumbles up out of the dirt.)',
          'Your Hushling floats over to the stone...', 'Hushling: "SHHHHH!"', '(...The snoring stops. Blessed quiet.)'],
          { portrait: 'hushling', onClose: () => { setFlags(G, 'pumbleHushed'); Quests.refresh(G); } });
        return true;
      }
    }
    if (map.id === 'home' && key === '7,1' && f.smudgeAsked && !f.smudgeFound) {
      G.say(['Your bed. Still warm. The pillow has a suspicious dent shaped like a ghost cat.',
        '...The dent purrs. It\'s SMUDGE! He was napping here all along.', 'Smudge floats after you, purring like a kettle.'],
        { onClose: () => { setFlags(G, 'smudgeFound'); Quests.refresh(G); } });
      return true;
    }
    const hit = loreAt(map.id, key);
    if (!hit) return false;
    const [id, L] = hit, got = Story.lorePages(L, G);
    if (!got) return false;   // condition not met: fall back to the old inspect / random epitaph
    const existing = Story.existingInspect(G, map, fx, fy);
    let pages = got.pages;
    if (existing && L.mode === 'append') pages = existing.concat(pages);
    else if (existing && L.mode === 'prepend') pages = pages.concat(existing);
    if (got.read) {
      Story.readLore(id);
      const pi = PACT_STONES.findIndex(([x, y]) => x === fx && y === fy);
      if (map.id === 'overworld' && pi >= 0) { f['pact' + (pi + 1)] = true; recountFlags(G); }
      if (map.id === 'overworld' && key === '27,47') f.wendelGraveRead = true;
    }

    return true;
  },
  shrine() {
    const G = Game, f = G.state.flags, existing = Story.existingInspect(G, G.map, SHRINE[0], SHRINE[1]) || [];
    const pages = LORE.shrine.pages.concat(existing);
    Story.readLore('shrine');
    if (f.vesperglowCaught) { G.say(LORE.shrine.pages.concat(['The shrine is empty now. Its little flame travels with you.'])); return; }
    if (!f.eddaThanked) { G.say(pages, { onClose: () => Quests.refresh(G) }); return; }
    if (f.vesperglowAsleep) {
      G.say(LORE.shrine.pages.concat(['The little flame is curled up asleep again...', '(It will wake after you rest at a Lantern House.)']));
      return;
    }
    if (!G.state.party.some(c => c.hp > 0)) {
      G.say(pages.concat(['Vesperglow: "Your friends are too tired, little keeper. Rest, then come back."']));
      return;
    }
    G.say(pages.concat(["Vesperglow: 'The trail burns bright again. Is your light steady, little keeper?'"]),
      { portrait: 'vesperglow', onClose: () => Story.vesperglowBattle() });
  },
  vesperglowBattle() {
    const G = Game;
    setFlags(G, 'vesperglowMet');
    return startBattle({ kind: 'wild', foes: [createCreature('vesperglow', 12)],
      special: { onCatch: () => { setFlags(G, 'vesperglowCaught'); delete G.state.flags.vesperglowAsleep;
        return [{ msg: "Vesperglow: 'I led the first lost ones home. Now I'll walk with you.'" }]; } },
      onEnd: (result) => {
        if (result !== 'caught') {
          G.state.flags.vesperglowAsleep = true;
          G.whenIdle(() => G.say(['The little flame curls up to sleep again...', '(It will wake after you rest at a Lantern House.)']));
        }
      } });
  },
  nibArrives() {
    Game.say(NIB_ARRIVAL, { speaker: 'Nib', onClose: () => { setFlags(Game, 'nibJoined'); Quests.refresh(Game); } });
  },
  bossBattle(npc) {
    const G = Game;

    G.hooks.startTrainerBattle('lady_ashgrave', npc, (result) => {
      if (result === 'win') {

      }

  crowmalkinGift() {

    G.say(['(Lady Ashgrave unties the black ribbon from the field gate.)', `(Crowmalkin joined you!${where})`],
      { portrait: sp, onClose: () => G.say(['And I... I think I\'d like to go outside.'], { speaker: 'Lady Ashgrave',
        onClose: () => G.pushScene(new FadeScene(() => {

    const first = !G.state.flags.ossuarchMet;

      onEnd: (result) => {

// ===================== QUESTS (STORY.md 4 + 6.2) =====================
// One source of truth (QUESTS + flags) for the journal, Nib's hints, markers, sparkles, the edge arrow and toasts.
const QUEST_IDS = Object.keys(QUESTS).sort((a, b) => QUESTS[a].order - QUESTS[b].order);
const Quests = {
  rec(id) { return Game.state && Game.state.quests[id]; },
  isStarted(id) { return !!this.rec(id); },
  isDone(id) { const r = this.rec(id); return !!(r && r.done); },
  active() { return QUEST_IDS.filter(id => this.isStarted(id) && !this.isDone(id)); },
  step(id) { const r = this.rec(id); return r && !r.done ? QUESTS[id].steps[r.step] || null : null; },
  stepText(id, G = Game) { const s = this.step(id); return s ? (typeof s.text === 'function' ? s.text(G) : s.text) : ''; },
  progress(id, G = Game) {   // { have, of } for counter steps
    const s = this.step(id); if (!s || !s.progress) return null;
    return { have: Math.min(s.progress.of, G.state.flags[s.progress.flag] || 0), of: s.progress.of };
  },
  // Explicit start (dialogue rules can call it; refresh also starts quests whose conditions hold).
  start(id, opts = {}) {
    const st = Game.state;
    if (!QUESTS[id] || st.quests[id]) return false;
    st.quests[id] = { step: 0, done: false, startedAt: Math.floor(st.playTime) };
    if (!opts.silent) Game.toast(('NEW QUEST: ' + QUESTS[id].title).slice(0, 34));
    return true;
  },
  canStart(id, G) {   // shows '!' over start.npc
    const q = QUESTS[id];
    return !this.isStarted(id) && !!q.start.npc && (!q.start.when || q.start.when(G));
  },
  shouldAutoStart(id, G) {
    const q = QUESTS[id], s = q.start;
    if (this.isStarted(id)) return false;
    if (s.npc) return (!s.when || s.when(G)) && !!(s.begun && s.begun(G));
    return !!(s.when && s.when(G));
  },
  // Auto-start, advance steps while done, hand out rewards once. Idempotent.
  refresh(G = Game, opts = {}) {
    if (!G.state) return;
    const silent = !!opts.silent, st = G.state;
    recountFlags(G);
    let changed = true, guard = 0;
    while (changed && guard++ < 50) {
      changed = false;
      for (const id of QUEST_IDS) {
        if (this.shouldAutoStart(id, G)) { this.start(id, { silent }); changed = true; }
        const r = st.quests[id]; if (!r || r.done) continue;
        const q = QUESTS[id];
        // progress toast for counters ("Lanterns lit 2/4")
        const s0 = q.steps[r.step];
        if (s0 && s0.progress) {
          const have = Math.min(s0.progress.of, st.flags[s0.progress.flag] || 0);
          if (have !== (r.prog || 0)) { if (!silent && have > (r.prog || 0) && have < s0.progress.of) G.toast(`★ ${s0.short || 'Progress'} ${have}/${s0.progress.of}`); r.prog = have; }
        }
        while (r.step < q.steps.length && q.steps[r.step].done(G)) {
          const s = q.steps[r.step];
          if (s.reward) this.grant(s.reward, { silent });
          r.step++; r.prog = 0; changed = true;
        }
        if (r.step >= q.steps.length) {
          r.done = true; r.doneAt = Math.floor(st.playTime); changed = true;
          if (!silent) G.toast('QUEST COMPLETE!');
          this.grant(q.reward || {}, { silent });
          if (st.tracked === id) st.tracked = null;
          // The main story ends with MQ6: victory / credits screen once the reward XP is handed out (16_ending.js).
          if (id === 'mq6_last_watch' && !silent && !st.flags.gameCleared) G.whenIdle(() => Ending.show());
        }
      }
    }
    if (st.tracked && !this.active().includes(st.tracked)) st.tracked = null;
  },
  // Reward = { items, coins, xp, flags, lore, creature, startQuests, text }. Silent grants (save migration) skip items/XP/toasts.
  grant(reward, opts = {}) {
    const G = Game, st = G.state, silent = !!opts.silent;
    if (!reward) return;
    for (const f of reward.flags || []) st.flags[f] = true;
    for (const id of [].concat(reward.lore || [])) Story.readLore(id, true);
    if (silent) return;
    for (const [item, n] of Object.entries(reward.items || {})) {
      st.bag[item] = (st.bag[item] || 0) + n;
      G.toast(`Got ${n} ${ITEMS[item].name}${n > 1 ? 's' : ''}!`);
    }
    if (reward.coins) { st.coins += reward.coins; G.toast(`Got ${reward.coins} coins!`); }
    if (reward.creature) G.hooks.giveCreature(reward.creature[0], reward.creature[1]);
    for (const id of reward.startQuests || []) this.start(id);
    if (reward.text) G.whenIdle(() => G.say(reward.text));
    if (reward.xp && st.party.length) {
      G.lastQuestXp = reward.xp;
      G.whenIdle(() => G.pushScene(new BattleScene({ kind: 'xp', xp: reward.xp, title: `Quest reward: your team shares ${reward.xp} XP!` })));
    }
  },
  // Tracked quest: state.tracked, else the active main quest with the lowest order, else the first active side quest.
  trackedId(G = Game) {
    const act = this.active();
    if (G.state.tracked && act.includes(G.state.tracked)) return G.state.tracked;
    return act.find(id => QUESTS[id].kind === 'main') || act[0] || null;
  },
  track(id) { Game.state.tracked = id; },
  markerFor(npcId, G = Game) {

    return null;
  },
  // Unfinished targets of a step: listed tiles + the turn-in NPC's spot.
  stepTargets(id, G = Game) {
    const s = this.step(id); if (!s) return [];
    const out = (s.targets || []).filter(t => !G.state.flags[t.flag]).map(t => Object.assign({ kind: 'tile' }, t));
    if (s.turnIn) {
      const live = G.npcs.find(n => n.def.id === s.turnIn);
      if (live) out.push({ kind: 'npc', map: G.map.id, x: live.x, y: live.y });
      else for (const [mid, m] of Object.entries(MAPS)) {
        const d = (m.npcs || []).find(n => n.id === s.turnIn && npcVisible(n));
        if (d) { out.push({ kind: 'npc', map: mid, x: d.x, y: d.y }); break; }
      }
    }
    return out;
  },
  // Where the arrow / {dir} should point: nearest target on this map, else the door or exit leading to it.
  trackedTarget(G = Game, qid) {
    const id = qid || this.trackedId(G); if (!id || !G.player) return null;
    const ts = this.stepTargets(id, G); if (!ts.length) return null;
    const p = G.player, here = ts.filter(t => t.map === G.map.id);
    const dist = (t) => Math.abs(t.x - p.x) + Math.abs(t.y - p.y);
    if (here.length) { const t = here.sort((a, b) => dist(a) - dist(b))[0]; return { map: t.map, x: t.x, y: t.y, kind: t.kind, quest: id }; }
    const t = ts[0];
    if (G.map.id !== 'overworld') {   // go outside first: the exit doormat
      for (let y = 0; y < G.map.h; y++) for (let x = 0; x < G.map.w; x++) if (G.map.rows[y][x] === 'e') return { map: G.map.id, x, y, kind: 'exit', final: t, quest: id };
      return null;
    }
    const door = Object.entries(MAPS.overworld.doors).find(([, d]) => d.to === t.map);
    if (!door) return null;

  },
  // Compass word from the player to the tracked target ("north-east").
  dirWord(G = Game, qid) {
    const t = this.trackedTarget(G, qid); if (!t) return 'somewhere';
    const dx = t.x - G.player.x, dy = t.y - G.player.y;
    if (Math.abs(dx) + Math.abs(dy) <= 1) return 'right next to';
    const ns = dy < -Math.abs(dx) / 2 ? 'north' : dy > Math.abs(dx) / 2 ? 'south' : '';
    const ew = dx > Math.abs(dy) / 2 ? 'east' : dx < -Math.abs(dy) / 2 ? 'west' : '';

  },
  // Short banner reminder of the tracked step (shown after the zone name).
  reminder(G = Game) {
    const id = this.trackedId(G); if (!id) return null;

  },
  // Nib's hint rules (STORY.md 4.2). Returns { lines, speaker, then? }.
  hint(G = Game, qid) {
    const st = G.state;
    if (!st.flags.nibJoined) return { lines: NIB_MUMBLE, speaker: null, rule: 'mumble' };
    const party = st.party, hp = party.reduce((a, c) => a + c.hp, 0), max = party.reduce((a, c) => a + c.stats.hp, 0);
    if (party.length && hp < max * 0.25) return { lines: ["Caw! Your friends look sleepy. Lantern House. Now."], speaker: 'Nib', rule: 'emergency' };
    const id = qid || this.trackedId(G), s = id ? this.step(id) : null;

      st.hints.bossTip = 1;

      const hasWisp = party.some(c => SPECIES[c.species].type === 'WISP');
      if (allBone || !hasWisp || party.length < 3) return { lines: [allBone ? NIB_PARTY_TIPS.bossBone : NIB_PARTY_TIPS.boss], speaker: 'Nib', rule: 'party' };

// ---------------- markers, sparkles, edge arrow, Nib on your shoulder ----------------
const GLYPHS = {
  '!': ['010', '010', '010', '010', '010', '000', '010'],
  '?': ['111', '101', '001', '011', '010', '000', '010'],
};
function drawGlyph(g, ch, x, y) {
  const rows = GLYPHS[ch];
  g.fillStyle = '#1a0f10';
  for (let r = 0; r < 7; r++) for (let c = 0; c < 3; c++) if (rows[r][c] === '1') { g.fillRect(x + c - 1, y + r, 3, 1); g.fillRect(x + c, y + r - 1, 1, 3); }
  g.fillStyle = '#ffd84a';
  for (let r = 0; r < 7; r++) for (let c = 0; c < 3; c++) if (rows[r][c] === '1') g.fillRect(x + c, y + r, 1, 1);
}
const ARROW_UP = ['0001000', '0011100', '0111110', '1111111', '0011100', '0011100', '0011100'];
const ARROW_ROWS = (() => {   // chunky 7x7 arrow; the other directions are rotations of "up"
  const rot = rows => rows.map((_, r) => rows.map(row => row[r]).reverse().join(''));   // 90 degrees clockwise
  const right = rot(ARROW_UP), down = rot(right), left = rot(down);
  return { up: ARROW_UP, right, down, left };
})();
function drawArrow(g, dir, x, y) {
  const rows = ARROW_ROWS[dir], n = rows.length;
  g.fillStyle = '#1a0f10';   // 1px dark outline (4-neighbour) so it reads on grass and stone
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (rows[r][c] === '1') {
    g.fillRect(x + c - 1, y + r, 3, 1); g.fillRect(x + c, y + r - 1, 1, 3);
  }
  g.fillStyle = '#ffd84a';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (rows[r][c] === '1') g.fillRect(x + c, y + r, 1, 1);
}
function drawQuestOverlay(g, cam) {
  const G = Game, st = G.state; if (!st) return;
  const t = G.time, markersOn = st.settings.markers !== false;
  G.markers = []; G.arrow = null; G.sparkles = [];
  if (markersOn) {
    for (const n of G.npcs) {
      const m = Quests.markerFor(n.def.id); if (!m) continue;
      const { px, py } = entityPixelPos(n), bob = Math.round(Math.sin(t * 4));
      G.markers.push({ id: n.def.id, mark: m });
      drawGlyph(g, m, px - cam.x + 6, py - cam.y - 9 + bob);
    }
    const id = Quests.trackedId(G), s = id && Quests.step(id);
    if (s) for (const tg of (s.targets || [])) {
      if (tg.map !== G.map.id || st.flags[tg.flag] || s.noSparkle) continue;
      G.sparkles.push({ x: tg.x, y: tg.y });
      if (Math.floor(t / 0.3) % 2 === 0) { g.fillStyle = '#ffffff'; g.fillRect(tg.x * TILE - cam.x + 13, tg.y * TILE - cam.y + 1, 2, 2); }
    }
    const tt = Quests.trackedTarget(G);
    if (tt && tt.map === G.map.id) {
      const sx = tt.x * TILE - cam.x + 8, sy = tt.y * TILE - cam.y + 8;
      if (sx < 0 || sx > SCREEN_W || sy < 0 || sy > SCREEN_H) {
        const pp = entityPixelPos(G.player), dx = tt.x * TILE - pp.px, dy = tt.y * TILE - pp.py;
        const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        const ax = dir === 'left' ? 2 : dir === 'right' ? SCREEN_W - 9 : clamp(sx - 3, 4, SCREEN_W - 11);
        const ay = dir === 'up' ? 2 : dir === 'down' ? SCREEN_H - 9 : clamp(sy - 3, 4, SCREEN_H - 11);
        const pulse = Math.floor(t * 3) % 2 ? 0 : (dir === 'left' ? -1 : dir === 'right' ? 1 : 0);
        const pulseY = Math.floor(t * 3) % 2 ? 0 : (dir === 'up' ? -1 : dir === 'down' ? 1 : 0);
        drawArrow(g, dir, ax + pulse, ay + pulseY);
        G.arrow = { dir, x: ax, y: ay, target: { x: tt.x, y: tt.y, kind: tt.kind } };
      }
    }
  }
  if (st.flags.nibJoined && G.player) {   // 5x4 crow on the player's shoulder; hops when the goal is on this map
    const { px, py } = entityPixelPos(G.player);
    const tt = markersOn ? Quests.trackedTarget(G) : null;
    const hop = tt && tt.map === G.map.id && tt.kind !== 'exit' && (t % 4) < 0.25 ? -2 : 0;
    const x = px - cam.x + 11, y = py - cam.y - 1 + hop;
    g.fillStyle = '#0c0a14'; g.fillRect(x, y + 1, 4, 3); g.fillRect(x + 1, y, 2, 1); g.fillRect(x - 1, y + 2, 1, 1);
    g.fillStyle = '#ff8a2a'; g.fillRect(x + 2, y + 1, 1, 1);
    g.fillStyle = '#e0a040'; g.fillRect(x + 4, y + 1, 1, 1);
  }
}

const JOURNAL_TABS = ['MAIN', 'SIDE', 'LORE', 'DONE'];

// ===================== BALANCE SIM (debug / tests only) =====================
// Fast auto-battle using the game's own formulas (calcDamage, effStat, typeMultiplier, MOVES, trainer AI rules).
// GAME.simBoss(n) -> win rate of each starter + one caught counter vs Lady Ashgrave.
function simBattle(partySpecs, trainerId, rng = Math.random) {
  const mk = ([sp, lv]) => createCreature(sp, lv);
  const P = partySpecs.map(mk), F = TRAINERS[trainerId].party.map(mk);
  let pi = 0, fi = 0, stP = { atk: 0, def: 0, spd: 0 }, stF = { atk: 0, def: 0, spd: 0 };
  const exp = (a, sa, d, sd, m) => MOVES[m].power ? calcDamage(a, sa, d, sd, m).dmg * MOVES[m].acc / 100 : 0;
  const best = (a, sa, d, sd) => a.moves.reduce((b, m) => exp(a, sa, d, sd, m) > exp(a, sa, d, sd, b) ? m : b, a.moves[0]);
  const stage = (st, k, n) => { st[k] = clamp(st[k] + n, -MAX_STAGE, MAX_STAGE); };
  const act = (a, sa, d, sd, m) => {
    const mv = MOVES[m];
    if (rng() * 100 >= mv.acc) return;
    if (mv.power > 0) {
      const dealt = Math.min(d.hp, calcDamage(a, sa, d, sd, m, rng).dmg); d.hp -= dealt;
      if (mv.effect === 'drain') a.hp = Math.min(a.stats.hp, a.hp + Math.max(1, Math.floor(dealt / 2)));
      if (d.hp > 0 && mv.effect === 'foeAtkDown') stage(sd, 'atk', -1);
      if (d.hp > 0 && mv.effect === 'foeDefDown') stage(sd, 'def', -1);
      if (d.hp > 0 && mv.effect === 'foeSpdDown') stage(sd, 'spd', -1);
      return;
    }
    if (mv.effect === 'foeAtkDown') stage(sd, 'atk', -1); else if (mv.effect === 'foeDefDown') stage(sd, 'def', -1);
    else if (mv.effect === 'foeSpdDown') stage(sd, 'spd', -1); else if (mv.effect === 'selfDefUp') stage(sa, 'def', 1);
    else if (mv.effect === 'selfAtkUp') stage(sa, 'atk', 1); else if (mv.effect === 'healHalf') a.hp = Math.min(a.stats.hp, a.hp + Math.floor(a.stats.hp / 2));
  };
  for (let turn = 0; turn < 200; turn++) {
    const p = P[pi], f = F[fi];
    const pm = best(p, stP, f, stF);
    const fm = rng() < 0.7 ? best(f, stF, p, stP) : f.moves[Math.min(f.moves.length - 1, Math.floor(rng() * f.moves.length))];

// Menu blips: decided from the key and the scene that receives it (called by Game.press before dispatch).
function soundForKey(k, scene) {
  if (!scene) return;
  const name = scene.constructor.name;
  if (name === 'OverworldScene') { if (k === 'start') Sound.play('open'); return; }
  if (name === 'FadeScene' || name === 'EncounterFlashScene' || name === 'TrainerSpotScene') return;
  if (name === 'DialogScene') { if (k === 'a' || k === 'b') Sound.play('text'); return; }
  if (name === 'BattleScene') {
    if (scene.mode === 'queue') { if ((k === 'a' || k === 'b' || k === 'start') && scene.cur && scene.cur.msg !== undefined) Sound.play('text'); return; }
    if (scene.mode === 'done') return;
  }
  if (name === 'VictoryScene' && scene.t < 2.5) return;
  if (DIRS[k]) Sound.play('cursor');
  else if (k === 'a' || k === 'start') Sound.play('select');
  else if (k === 'b') Sound.play('back');

// ===================== ROUTE TRAINERS (stage 5) =====================
// Forager Pip and Gravedigger Ott watch the Whisperwood Trail. Each NPC def has `sight` (tiles it can see ahead,
// blocked by solid tiles and other NPCs) and optionally `turns` (directions it looks around in).
// If you step into view while you have a creature that can battle: "!", the trainer walks up, talks, battles.
// Defeated trainers are stored in state.defeatedTrainers (saved) and never challenge again.
// Their side quests (SQ5 Glowcap Soup, SQ6 Something With Antlers) start when you talk to them after beating them.
const TRAINER_TALK = {
  forager_pip: {
    intro: ["Hey! You with the creature! Every forager tests new sprouts. That's the rule!", "Show me what you've picked up. Battle!"],
    lose: "Squished like a glowcap! You're really good.",
    noParty: "You've no creature ready to battle? Come back when you do. I'll be foraging.",
  },
  gravedigger_ott: {
    intro: ["Hold it. Nobody walks past my grass without a proper howdy-do.", "Creatures out, lantern-bearer. Let's see what you've got."],
    lose: "Well, dig me a hole. You're the real thing.",
    noParty: "No creature fit to battle? Rest up at a Lantern House, then come see old Ott.",
  },
};
function trainerDefeated(G, id) { return !!(G.state && G.state.defeatedTrainers && G.state.defeatedTrainers[id]); }
function partyAble(G) { return !!(G.state && G.state.party.some(c => c.hp > 0)); }
const Trainers = {
  enabled: true,   // tests can switch line-of-sight off (GAME.setTrainerSight)
  // Undefeated route trainers standing on the current map (the boss never uses line of sight).
  watchers(G = Game) { return G.npcs.filter(n => n.def.trainer && n.def.sight && TRAINERS[n.def.trainer] && !TRAINERS[n.def.trainer].boss && !trainerDefeated(G, n.def.trainer)); },
  // Distance (1..sight) if the trainer can see the player right now, else 0.
  lineOfSight(n, p = Game.player) {
    if (!p || n.moving) return 0;
    const [dx, dy] = DIRS[n.dir];
    for (let i = 1; i <= (n.def.sight || 0); i++) {
      const x = n.x + dx * i, y = n.y + dy * i;
      if (x === p.x && y === p.y) return i;
      if (TILE_INFO[tileAt(Game.map, x, y)].solid || Game.npcs.some(o => o !== n && o.x === x && o.y === y)) return 0;
    }
    return 0;
  },
  // Called after each completed step (and when a trainer turns). Returns true if a trainer spotted the player.
  check(G = Game) {
    if (!this.enabled || !G.state || !G.player || G.player.moving || G.top() !== G.overworld || !partyAble(G)) return false;
    for (const n of this.watchers(G)) {
      const d = this.lineOfSight(n);
      if (d) { this.spot(G, n, d); return true; }
    }
    return false;
  },
  // Trainers with `turns` look around every couple of seconds (and may spot you while you stand still).
  update(dt) {
    if (Game.freezeNPCs) return false;
    for (const n of this.watchers(Game)) {
      const turns = n.def.turns; if (!turns || n.moving) continue;
      if (n.turnT === undefined) n.turnT = 2 + hash2(n.x, n.y, 21) * 1.5;
      n.turnT -= dt;
      if (n.turnT > 0) continue;
      n.turnT = 2.2 + Math.random() * 1.6;
      n.dir = turns[(turns.indexOf(n.dir) + 1) % turns.length];
      if (this.check(Game)) return true;
    }
    return false;
  },
  spot(G, npc, dist) {
    G.lastSpot = { trainer: npc.def.trainer, npc: npc.def.id, dist, from: { x: npc.x, y: npc.y }, player: { x: G.player.x, y: G.player.y } };
    G.spotCount = (G.spotCount || 0) + 1;
    G.pushScene(new TrainerSpotScene(npc, dist));
  },
  // Start the battle (from the trainer's challenge dialogue). After a win, the trainer talks again (quest offer).
  fight(G, npc) {
    const id = npc.def.trainer;
    if (!partyAble(G)) return G.say([TRAINER_TALK[id].noParty], { speaker: npc.def.name });
    G.hooks.startTrainerBattle(id, npc, (result) => {
      if (result !== 'win') return;
      G.whenIdle(() => { const live = G.npcs.find(n => n.def.id === npc.def.id); if (live) G.talkTo(live); });
    });
