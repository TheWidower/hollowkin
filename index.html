// "!" over the trainer, then it walks up to you; ends by starting its dialogue (which starts the battle).
class TrainerSpotScene {
  constructor(npc, dist) {
    this.opaque = false; this.npc = npc; this.steps = Math.max(0, dist - 1); this.t = 0; this.phase = 'alert';
    Sound.play('spot');
  }
  update(dt) {
    const n = this.npc;
    this.t += dt;
    if (this.phase === 'alert') { if (this.t >= 0.8) this.phase = 'walk'; return; }
    if (n.moving) {
      n.moveT += dt / (WALK_TIME * 1.25);
      if (n.moveT >= 1) { n.moving = false; n.x = n.tx; n.y = n.ty; n.moveT = 0; n.stepParity ^= 1; this.steps--; }
      return;
    }
    if (this.steps > 0) {
      const [dx, dy] = DIRS[n.dir];
      n.tx = n.x + dx; n.ty = n.y + dy; n.moving = true; n.moveT = 0;
      return;
    }
    const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
    Game.player.dir = opposite[n.dir];
    Game.popScene(this);
    Game.talkTo(n);   // the challenge rule below -> battle
  }
  onPress() {}
  draw(g) {
    const cam = Game.camera, { px, py } = entityPixelPos(this.npc);   // the "!" stays over the trainer while it walks up
    const pop = Math.min(1, this.t / 0.12);
    const x = clamp((px - cam.x + 4) * SCALE, 8, 640 - 44), y = Math.max(8, (py - cam.y - 13) * SCALE + Math.round((1 - pop) * 12));
    // pixel speech bubble: 8x10 low-res pixels with a tail
    g.fillStyle = PAL.outline; g.fillRect(x - 4, y - 4, 40, 44); g.fillRect(x + 8, y + 40, 12, 8);
    g.fillStyle = '#f2ecff'; g.fillRect(x, y, 32, 36); g.fillRect(x + 12, y + 36, 4, 6);
    g.fillStyle = '#d0203a'; g.fillRect(x + 12, y + 4, 8, 18); g.fillRect(x + 12, y + 26, 8, 6);
  }
}

// Trainer dialogue comes before the NPCs' story rules: an undefeated trainer challenges you.
for (const [npcId, tid] of [['pip', 'forager_pip'], ['ott', 'gravedigger_ott']]) {
  DIALOGUE[npcId].unshift(
    { when: (G) => !trainerDefeated(G, tid) && partyAble(G), lines: TRAINER_TALK[tid].intro, then: (G, npc) => Trainers.fight(G, npc) },
    { when: (G) => !trainerDefeated(G, tid), lines: (G, base) => base.concat([TRAINER_TALK[tid].noParty]) });
}
// SQ5 / SQ6 open once you've beaten the trainer (STORY.md 3: "Talk to Pip/Ott after beating him").
QUESTS.sq_glowcap_soup.start.when = (G) => trainerDefeated(G, 'forager_pip');
QUESTS.sq_pact_stones.start.when = (G) => trainerDefeated(G, 'gravedigger_ott');

// ===================== SAVE PROMPT + VICTORY / CREDITS (stage 5) =====================
// ---------------- Pause -> SAVE ----------------
// Asks first; warns when the slot holds a different journey (e.g. after NEW GAME). Writes through SaveSystem (SafeStorage).
class SaveScene {
  constructor(opts = {}) {
    this.opaque = false; this.yes = 0; this.opts = opts;
    this.old = SaveSystem.info();
    this.overwrite = !!(this.old && Game.state && this.old.runId !== (Game.state.runId || 'legacy'));
  }
  update() {}
  onPress(k) {
    if (k === 'up' || k === 'down' || k === 'left' || k === 'right') this.yes ^= 1;
    else if (k === 'b' || ((k === 'a' || k === 'start') && this.yes === 1)) { Game.popScene(this); if (this.opts.onClose) this.opts.onClose(false); }
    else if (k === 'a' || k === 'start') this.doSave();
  }
  doSave() {
    Game.popScene(this);
    const ok = SaveSystem.save();
    Game.lastSave = { ok, at: Date.now() };
    Sound.play(ok ? 'save' : 'error');
    Game.say(ok ? ['Your journey has been saved!', '(Choose CONTINUE on the title screen to pick up right here.)']
                : ['The journal pages won\'t stick... Saving failed.', '(This browser is blocking storage. Private mode, maybe?)'],
      { onClose: () => { if (this.opts.onClose) this.opts.onClose(ok); } });
  }
  draw(g) {
    const st = Game.state, z = Game.map.id === 'overworld' ? zoneAt(Game.map, Game.player.x, Game.player.y) : null;
    drawBox(g, 48, 120, 544, this.overwrite ? 300 : 270);
    menuTitle(g, 'SAVE YOUR JOURNEY?', 80, 170);
    g.font = MFONT_S; g.fillStyle = PAL.text;
    const lead = st.party[0];
    const rows = [`${z ? z.name : Game.map.title}   \u00b7   ${fmtTime(st.playTime)}`,
      lead ? `${SPECIES[lead.species].name} Lv${lead.level}${st.party.length > 1 ? ` and ${st.party.length - 1} more` : ''}` : 'No creatures yet',
      `Creatures caught ${Object.keys(st.caught).length}   \u00b7   Lore pages ${Story.loreCount()}/${LORE_IDS.length}`];
    rows.forEach((t, i) => g.fillText(t, 80, 212 + i * 30));
    let y = 312;
    if (this.overwrite) { g.fillStyle = '#ff8a6a'; g.fillText('This replaces your OTHER saved journey!', 80, y); y += 36; }
    ['YES', 'NO'].forEach((t, i) => {
      const x = 180 + i * 180, sel = i === this.yes;
      g.font = FONT; g.fillStyle = sel ? PAL.flame2 : PAL.text; g.fillText(t, x, y + 40); if (sel) cursorAt(g, x - 30, y + 40);
    });
  }
}

// ---------------- the ending ----------------
// The main story ends when MQ6 "The Last Watch Ends" completes (you woke Ossuarch, the Keeper of Endings).
// Victory / credits screen -> back to the world (free play: side quests, the Creature Log, lore) -> offer to save.
const Ending = {
  shown: false,
  stats() {
    const st = Game.state;
    const side = QUEST_IDS.filter(id => QUESTS[id].kind === 'side');
    return {
      party: st.party.map(c => ({ species: c.species, level: c.level })),
      playTime: st.playTime, caught: Object.keys(st.caught).length, species: Object.keys(SPECIES).length,
      lore: Story.loreCount(), loreTotal: LORE_IDS.length,
      questsDone: QUEST_IDS.filter(id => Quests.isDone(id)).length, questsTotal: QUEST_IDS.length,
      sideLeft: side.filter(id => !Quests.isDone(id)).length,
    };
  },
  show() {
    const st = Game.state;
    if (!st.flags.gameCleared) { st.flags.gameCleared = true; st.clearTime = Math.floor(st.playTime); }
    Game.victoryCount = (Game.victoryCount || 0) + 1;
    const fade = new FadeScene(() => {   // slip the victory screen in under the fade so it fades in
      const i = Game.scenes.indexOf(fade);
      Game.scenes.splice(i < 0 ? Game.scenes.length : i, 0, new VictoryScene(Ending.stats()));
    }, 1.2);
    Game.pushScene(fade);
  },
  afterVictory() {
    const s = Ending.stats();
    const lines = ['Caw! So that\'s the end of the story... for now.',
      s.sideLeft ? `Folks still need help: ${s.sideLeft} side quest${s.sideLeft > 1 ? 's' : ''} left. Check the JOURNAL.` : 'Every side quest done, too. Show-off.',
      `Creature Log: ${s.caught} of ${s.species}. Lore pages: ${s.lore} of ${s.loreTotal}. The forest's still full of lost things.`];
    Game.say(lines, { speaker: Game.state.flags.nibJoined ? 'Nib' : null, onClose: () => Game.pushScene(new SaveScene()) });
  },
};
class VictoryScene {
  constructor(stats) { this.opaque = true; this.t = 0; this.stats = stats; this.closing = false; Sound.play('victory'); }
  update(dt) { this.t += dt; }
  get ready() { return this.t >= 2.5; }
  onPress(k) {
    if (!this.ready || this.closing || !(k === 'a' || k === 'b' || k === 'start')) return;
    this.closing = true;
    Game.pushScene(new FadeScene(() => { Game.popScene(this); Game.whenIdle(() => Ending.afterVictory()); }, 1.0));
  }
  draw(g) {
    const t = this.t, s = this.stats;
    g.fillStyle = '#07050f'; g.fillRect(0, 0, 640, 576);
    for (let i = 0; i < 60; i++) {   // stars + rising wisps
      const x = (hash2(i, 11) * 640 + Math.sin(t * 0.5 + i) * 20 + 640) % 640;
      const y = (hash2(i, 12) * 576 - t * (6 + i % 9) * 2 + 57600) % 576;
      g.fillStyle = `rgba(${i % 4 ? '182,255,106' : '255,212,107'},${(0.25 + 0.3 * Math.sin(t * 2 + i)).toFixed(2)})`; g.fillRect(Math.round(x), Math.round(y), 4, 4);
    }
    const fade = (t0) => clamp((t - t0) / 0.6, 0, 1);
    g.textAlign = 'center';
    g.globalAlpha = fade(0.1);
    g.font = 'bold 64px "DejaVu Sans Mono", monospace';
    g.fillStyle = '#2a1a4a'; g.fillText(GAME_TITLE, 324, 96); g.fillStyle = '#d8c8ff'; g.fillText(GAME_TITLE, 320, 90);
    g.font = FONT; g.fillStyle = PAL.textDim; g.fillText('Lanterns & Lost Things', 320, 126);
    g.globalAlpha = fade(0.6);
    g.fillStyle = PAL.flame; g.fillText('The lanterns are loved again.', 320, 170);
    g.fillStyle = PAL.text; g.font = MFONT_S; g.fillText('The Keeper is awake. The forest dreams again.', 320, 198);
    // the party parades along
    g.globalAlpha = fade(1.0);
    const n = s.party.length, w = 96;
    s.party.forEach((c, i) => {
      const x = 320 - (n * w) / 2 + i * w + 16, bob = Math.round(Math.sin(t * 4 + i) * 4);
      g.imageSmoothingEnabled = false; g.drawImage(CREATURE_SPRITES[c.species], x, 222 + bob, 64, 64);
      g.font = MFONT_XS; g.fillStyle = PAL.text; g.fillText(`${SPECIES[c.species].name}`, x + 32, 306);
      g.fillStyle = TYPES[SPECIES[c.species].type].color; g.fillText(`Lv${c.level}`, x + 32, 324);
    });
    g.globalAlpha = fade(1.5);
    drawBox(g, 120, 340, 400, 128);
    g.font = MFONT_S; g.fillStyle = PAL.text; g.textAlign = 'left';
    [['Play time', fmtTime(s.playTime)], ['Creatures caught', `${s.caught} / ${s.species}`], ['Lore pages', `${s.lore} / ${s.loreTotal}`], ['Quests done', `${s.questsDone} / ${s.questsTotal}`]]
      .forEach(([a, b], i) => { g.fillStyle = PAL.textDim; g.fillText(a, 150, 376 + i * 24); g.fillStyle = PAL.text; g.textAlign = 'right'; g.fillText(b, 490, 376 + i * 24); g.textAlign = 'left'; });
    g.textAlign = 'center';
    g.globalAlpha = fade(2.0);
    g.font = MFONT_XS; g.fillStyle = PAL.textDim;
    g.fillText('Starring Nib, Lady Ashgrave, Crowmalkin, Ossuarch', 320, 492);
    g.fillText('and every lost thing in the Gloamwood', 320, 510);
    g.font = FONT; g.fillStyle = PAL.flame2; g.fillText('Thanks for playing!', 320, 540);
    g.globalAlpha = 1;
    if (this.ready && Math.floor(t * 2) % 2 === 0) { g.font = MFONT_XS; g.fillStyle = PAL.text; g.fillText('SPACE: back to the Gloamwood (side quests await)', 320, 566); }
    g.textAlign = 'left';
  }
}

// ---------------- test / debug hooks (stage 5) ----------------
Object.assign(window.GAME, {
  Trainers, TRAINER_TALK, Sound, SFX_NAMES, Ending,
  setTrainerSight(on) { Trainers.enabled = !!on; },
  lastSpot() { return Game.lastSpot || null; },
  spotCount() { return Game.spotCount || 0; },
  defeatedTrainers() { return Object.assign({}, Game.state.defeatedTrainers); },
  trainerNpcs() { return Game.npcs.filter(n => n.def.trainer).map(n => ({ id: n.def.id, trainer: n.def.trainer, x: n.x, y: n.y, dir: n.dir, sight: n.def.sight || 0 })); },
  save() { return SaveSystem.save(); },
  hasSave() { return SaveSystem.hasSave(); },
  saveInfo() { return SaveSystem.info(); },
  lastSave() { return Game.lastSave || null; },
  showVictory() { Ending.show(); },
  victoryCount() { return Game.victoryCount || 0; },
  audio() {
    const c = Sound.ctx;
    return { available: Sound.available, started: Sound.started, state: c ? c.state : null, muted: Settings.muted, volume: Settings.volume,
      ambient: Settings.ambient, mood: Sound.mood, requested: Sound.requested, played: Sound.played, last: Sound.last, errors: Sound.errors };
  },
  playSfx(name) { return Sound.play(name); },
  settings() { return { brightness: Settings.brightnessName(), volume: Settings.volume, muted: Settings.muted, ambient: Settings.ambient }; },
});

// ===================== START =====================
// Runs after every part above (engine, battle, and optional extras such as 09_touch.js) has been defined.
boot();
</script>
